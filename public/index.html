<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coquito Amarillo S.A.S. — Registro de Pedidos</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="encabezado">
    <p class="marca">Coquito Amarillo S.A.S.</p>
  </header>
  <main class="contenedor-formulario">
    <h1>Registro de Pedidos</h1>
    <form id="formPedido" novalidate>
      <label for="nombreCliente">Nombre del cliente</label>
      <input type="text" id="nombreCliente" name="nombreCliente" maxlength="100" required autocomplete="name">

      <label for="producto">Producto</label>
      <input type="text" id="producto" name="producto" maxlength="100" required>

      <label for="cantidad">Cantidad</label>
      <input type="number" id="cantidad" name="cantidad" min="1" step="1" required>

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo" maxlength="150" required autocomplete="email">

      <button type="submit">Registrar pedido</button>
    </form>
    <p id="mensaje" role="status" aria-live="polite"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
